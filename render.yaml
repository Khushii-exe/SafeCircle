services:
  - type: web
    name: safecircle-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SEED_DEMO
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.0"

